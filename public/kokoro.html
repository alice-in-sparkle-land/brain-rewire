<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9DFCB">
<meta name="color-scheme" content="light">
<title>Kokoro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C8452C'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23FFF6EC' font-family='serif'%3E%E5%BF%83%3C/text%3E%3C/svg%3E">
<style>
:root{--serif:"Noto Serif",Georgia,serif;--sans:system-ui,Roboto,"Segoe UI",sans-serif;--mono:ui-monospace,"Roboto Mono",monospace;
--bg:#F2F4EC;--card:#FFFDF8;--ink:#1E2733;--mut:#646A71;--faint:#9AA0A6;--line:#E4DED1;--soft:#F3EDE2;--ac:#3B7A4D;--ac2:#C6613A;--danger:#A2403A;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.hd{position:relative;height:196px;overflow:hidden;color:#1E2733}
.hd.sub{height:150px}
.hd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hd.dark{color:#fff}
.hd.dark .hdt,.hd.dark .clock,.hd.dark .hsub{text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hdin{position:absolute;left:16px;right:16px;top:calc(26px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.stamp{width:42px;height:42px;border-radius:9px;background:#C8452C;color:#FFF6EC;font:600 25px/1 var(--serif);display:grid;place-items:center;transform:rotate(-4deg);flex:none;box-shadow:0 2px 6px rgba(120,30,10,.25)}
.hdt{font:600 25px/1.15 var(--serif);letter-spacing:.3px}
.hsub{font-size:13px;opacity:.85}
.clock{margin-left:auto;font:500 28px/1 var(--mono);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.backb{width:42px;height:42px;border-radius:50%;background:rgba(255,253,248,.85);color:#1E2733;display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sdot{width:10px;height:10px;border-radius:50%;background:#9AA0A6;box-shadow:0 0 0 2px rgba(255,255,255,.8);flex:none}
.s-ok{background:#3E9B5B}.s-busy{background:#E09A2D}.s-offline,.s-off{background:#9AA0A6}.s-pin,.s-auth,.s-locked,.s-error,.s-server,.s-setup,.s-foreign,.s-bad,.s-noserver{background:#C9473F}
.wrap{position:relative;margin:-36px auto 0;padding:0 14px;max-width:560px}
.banner{background:#7A2E3A;color:#fff;font-size:13.5px;padding:9px 14px;display:flex;gap:10px;align-items:center}
.banner button{text-decoration:underline;font-weight:600}

/* cards and text */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 8px 20px -16px rgba(40,30,10,.45)}
.card.flat{padding:4px 16px}
.lbl{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700}
.h2{font:600 19px/1.3 var(--serif);margin:0}
.sm{font-size:13px;color:var(--mut)}
.mut{color:var(--mut)}
.row0{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{color:var(--ac);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mut);margin:16px 4px 7px}
.sec i{width:10px;height:10px;border-radius:50%;flex:none}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
.empty b{display:block;color:var(--ink);font:600 17px var(--serif);margin-bottom:4px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ac);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;min-height:46px}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn.d{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.w{width:100%}
.btn.sm2{min-height:38px;padding:8px 12px;font-size:14px}
.btns{display:flex;gap:10px;margin-top:12px}.btns>*{flex:1}
.in,textarea.in,select.in{width:100%;font:16px/1.45 var(--sans);color:var(--ink);background:#FFFEFB;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;-webkit-appearance:none;appearance:none}
textarea.in{resize:vertical;min-height:84px}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.in:focus{outline:none;border-color:var(--ac)}
.fld{margin-top:12px}.fld label,.fl{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.err{color:var(--danger);font-size:13px;min-height:0;margin-top:4px}
.err:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);line-height:1.3;max-width:100%}
.chip.add{background:transparent;border-style:dashed;color:var(--mut)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:999px;font-size:13px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.typeb{display:flex;gap:8px}
.typeb button{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;background:var(--card)}
.typeb button.on{color:#fff;font-weight:700}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pp{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.lvb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvb button{padding:10px 2px;border-radius:12px;border:1.5px solid var(--line);font-size:12.5px;background:var(--card);font-weight:600}
.toggle{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--ac);flex:none}

/* lists */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 16px var(--serif);flex:none}
.av.big{width:52px;height:52px;font-size:21px}
.grow{flex:1;min-width:0}
.nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.one{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;flex:none}.dots i{width:9px;height:9px;border-radius:50%}
.tl{padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;display:block}
.tl:first-child{border-top:0}
.tl .tx{font-size:15px;line-height:1.45;margin-top:5px;overflow-wrap:anywhere}

/* map */
.mapbox{position:relative;width:100%;aspect-ratio:1;margin:6px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mq{position:absolute;width:50%;height:50%;opacity:.09}
.ring{position:absolute;border-radius:50%;border:1px solid #DDD5C6;background:rgba(255,255,255,.72)}
.zl{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;color:var(--mut);text-align:center;line-height:1.2;pointer-events:none;max-width:84px}
.zl.c{font-size:10px}
.mcor{display:flex;justify-content:space-between;gap:16px;font-size:12px;font-weight:600;line-height:1.25;margin-top:6px}
.mcor.top{margin:10px 0 -2px}
.mcor span{max-width:46%}
.mdot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.22);touch-action:none;z-index:3}
.mdot::after{content:"";position:absolute;inset:-10px}
.mdot .nmz{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff}
.mdot.up .nmz{top:auto;bottom:24px}
.mdot.drag{transform:scale(1.2);z-index:9;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.mdot.pulse{box-shadow:0 0 0 6px rgba(200,69,44,.35)}
.tray{display:flex;flex-wrap:wrap;gap:16px 14px;min-height:46px;padding:10px 6px 22px;align-items:flex-start}
.tray .mdot{position:relative;margin:0}
.legend .li{padding:8px 0}
.legend i{width:11px;height:11px;border-radius:50%;flex:none}

/* person */
.mix{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:10px 0 6px;background:var(--soft)}
.mixl{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.mixl b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.act{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.act:first-of-type,.month+.act{border-top:0}
.act .ld{width:13px;height:13px;border-radius:50%;margin-top:5px;flex:none}
.month{font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.saved{font-size:12px;color:var(--ac);margin-left:8px;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* becoming */
.wd{display:inline-block;padding:2px 3px;margin:1px 0;border-radius:7px;font:17px/1.6 var(--serif);cursor:pointer;user-select:none;-webkit-user-select:none}
.wd.pk{background:#F6DFD6;color:#8E361B;box-shadow:inset 0 -2px 0 #C8613E}
.note{border:1px solid var(--line);border-left:3px solid var(--ac2);border-radius:0 12px 12px 0;padding:9px 11px;margin-top:9px;background:#FFFEFB}
.note .ph{font:600 15px/1.4 var(--serif);color:#8E361B;overflow-wrap:anywhere}
.note textarea.in{min-height:56px;margin-top:6px;font-size:15px}
.tb{padding:12px 0 14px;border-top:1px solid var(--line)}
.tb:first-of-type{border-top:0}
.ban{border:1.5px solid var(--ac)}
.pick{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick input{width:22px;height:22px;margin-top:2px;accent-color:var(--ac);flex:none}
.report{width:100%;min-height:240px;font:12.5px/1.6 var(--mono);white-space:pre-wrap}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));height:calc(68px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--mut);gap:2px;width:64px;padding:4px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ac);font-weight:700}
.fab{width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 18px -6px rgba(0,0,0,.4);flex:none}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;fill:none}

/* sheets */
.ov{position:fixed;inset:0;z-index:30;background:rgba(20,25,30,.42);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .22s ease-out}
.ov.open .sheet{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.shd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 6px}
.x{font-size:15px;color:var(--ac);font-weight:700;padding:8px 2px}
.big3{display:grid;gap:10px;margin-top:8px}
.big3 button{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:16px;text-align:left;background:var(--card)}
.big3 .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:600 20px var(--serif);color:#fff;flex:none}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.worlds button{border:2px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;background:var(--card)}
.worlds button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.worlds img{display:block;width:100%;height:64px;object-fit:cover}
.worlds b{display:block;padding:7px 10px;font:600 15px var(--serif)}
.diag{font:12px/1.5 var(--mono);background:var(--soft);border-radius:10px;padding:8px 10px;max-height:160px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:50;background:#1E2733;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.crash{padding:28px 18px;text-align:center}

body.lite *,body.lite *::before,body.lite *::after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div id="banner" class="banner hidden" role="alert"></div>
<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<input type="file" id="file" accept="application/json,.json,text/plain" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
(function(){
/* ===== data.js — constants, sanitizers, storage, backup and old-file import ===== */
const APP_ID = 'kokoro';
const APP_VER = '1.0.0';
const LS_KEY = 'kkr.v1', LS_DEV = 'kkr.dev', LS_SYNC = 'kkr.sync', LS_VIS = 'kkr.vis', LS_DIAG = 'kkr.diag';

/* Map zones: 3 rings (how close) and 4 outer corners (clear boundaries). */
const ZONES = ['ring1', 'ring2', 'ring3', 'q_tr', 'q_tl', 'q_bl', 'q_br'];
const ZONE_DEF = {
  ring1: 'Closest', ring2: 'Close', ring3: 'Known',
  q_br: 'Negative · set a boundary', q_bl: 'Negative · let go',
  q_tl: 'Not negative · accept', q_tr: 'Fine, but I keep distance'
};
const ZONE_COL = { ring1: '#C9635B', ring2: '#C99A4A', ring3: '#7FA37A', q_tr: '#8A7CA8', q_br: '#B5573F', q_bl: '#8B7F6E', q_tl: '#5E7A96', none: '#A6A196' };
/* The old map's own (Vietnamese) default names: if the backup still has these, English defaults are used. */
const ZONE_VI_DEF = {
  ring1: 'Thân thiết nhất', ring2: 'Thân thiết vừa', ring3: 'Quen biết',
  q_br: 'Tiêu cực — cần đặt ranh giới', q_bl: 'Tiêu cực — buông bỏ',
  q_tl: 'Không tiêu cực — chấp nhận', q_tr: 'Ổn, nhưng mình chọn giữ khoảng cách'
};
/* Action levels: what someone did, one action at a time. */
const LEVELS = [0, 1, 2, 3, 4];
const LEVEL_DEF = ['Toxic', 'Hurtful', 'Neutral', 'Good', 'Inspiring'];
const LEVEL_COL = ['#7A2E3A', '#C8613E', '#A39E92', '#5E9A5A', '#D9A532'];
const LEVEL_BG = ['#F3E1E4', '#F8E4DA', '#EFEDE8', '#E3EFE0', '#F8EDD2'];
const LEVEL_INK = ['#6A2230', '#9A3B1E', '#5F5B52', '#2F6B2C', '#8A6411'];
/* Thought types (from Stress Test) */
const TYPES = ['spiral', 'hope', 'fact'];
const TYPE_NAME = { spiral: 'Spiral', hope: 'Hope', fact: 'Fact' };
const TYPE_LONG = { spiral: 'Spiral thought', hope: 'Hope', fact: 'Fact' };
const TYPE_COL = { spiral: '#C8613E', hope: '#1D9E75', fact: '#7F77DD' };
const TYPE_BG = { spiral: '#F6DFD6', hope: '#DDF0E8', fact: '#E6E4F7' };
const TYPE_INK = { spiral: '#9A3B1E', hope: '#156A50', fact: '#4A42A0' };

const BRIGHT = ['Loyal', 'Kind', 'Generous', 'Honest', 'Curious', 'Patient', 'Funny', 'Brave', 'Thoughtful', 'Enthusiastic', 'Reliable', 'Gentle'];
const TENDER = ['Insecure', 'Anxious', 'Stubborn', 'Impatient', 'Guarded', 'Proud', 'Sensitive', 'Restless', 'Self-critical', 'Distracted'];

const LIM = { people: 2000, actions: 20000, thoughts: 20000, sessions: 5000, traits: 40, sessThoughts: 60, notes: 400, linked: 60 };

/* ---------- small helpers ---------- */
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function sStr(v, n) { if (typeof v === 'number') v = String(v); if (typeof v !== 'string') return ''; v = v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, ''); return v.length > n ? v.slice(0, n) : v; }
function sLine(v, n) { return sStr(v, n * 2).replace(/[\r\n\t]+/g, ' ').trim().slice(0, n); }
function sNum(v, a, b, d) { v = Number(v); return Number.isFinite(v) ? Math.min(b, Math.max(a, v)) : d; }
function sTs(v) { if (typeof v === 'string' && v && !/^\d+$/.test(v)) v = Date.parse(v); v = Number(v); return Number.isFinite(v) && v > 0 && v < 4102444800000 ? Math.round(v) : 0; }
const sBool = v => v === true || v === 1 || v === 'true';
function sId(v) { if (typeof v === 'number') v = String(v); return typeof v === 'string' && /^[A-Za-z0-9_-]{1,48}$/.test(v) ? v : ''; }
function sDate(v) { if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return ''; const d = new Date(v + 'T00:00:00'); return isNaN(d) ? '' : v; }
function keyOf(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayKey = () => keyOf(Date.now());
function sIds(v, max) { const out = [], seen = new Set(); if (Array.isArray(v)) for (const x of v) { const id = sId(x); if (id && !seen.has(id)) { seen.add(id); out.push(id); if (out.length >= max) break; } } return out; }
function cleanList(v, fn, max) { const out = [], seen = new Set(); if (!Array.isArray(v)) return out; for (const x of v) { let y = null; try { y = fn(x); } catch (e) { y = null; } if (y && !seen.has(y.id)) { seen.add(y.id); out.push(y); if (out.length >= max) break; } } return out; }

/* ---------- item sanitizers ---------- */
function sPlace(p) {
  if (!isObj(p)) return null;
  const x = Number(p.x), y = Number(p.y);
  if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
  return { x: Math.round(Math.min(100, Math.max(0, x)) * 10) / 10, y: Math.round(Math.min(100, Math.max(0, y)) * 10) / 10 };
}
function sPerson(p) {
  if (!isObj(p)) return null;
  const id = sId(p.id); const name = sLine(p.name, 60);
  if (!id || !name) return null;
  const refl = isObj(p.refl) ? p.refl : {};
  return {

/* ---------- Lite mode: turns itself on after an unexpected close ---------- */
function checkCrash() {
  try {
    const v = JSON.parse(lsGet(LS_VIS) || 'null');
    if (isObj(v) && v.vis === 1 && Date.now() - (v.t || 0) < 10 * 60e3 && !D.lite) {
      D.lite = true; D.autoLite = true; saveDev();
      logDiag('last session closed unexpectedly: Lite mode on');
      setTimeout(() => toast('Kokoro closed unexpectedly last time, so Lite mode is on. Change it in Settings.', 4200), 600);
    }
  } catch (e) { /* ignore */ }
}
function markVisible(vis) { lsSet(LS_VIS, JSON.stringify({ vis: vis ? 1 : 0, t: Date.now() })); }
function applyLite() { document.body.classList.toggle('lite', !!D.lite); }

/* ---------- start ---------- */
function start() {
  checkCrash(); applyLite();
  applyTheme(pickTheme());
  loadSC(); takeSnap();
  if (!STORAGE_OK) storageBanner();
  initHistory();
  render();
  markVisible(true);
  setInterval(() => { if (!document.hidden) { tickClock(); markVisible(true); } }, 15000);
  setInterval(() => { if (!document.hidden && SC.on) syncNow(false); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { flushTyping(); markVisible(false); flushOnHide(); }
    else { markVisible(true); tickClock(); if (SC.on) syncNow(false); }
  });
  window.addEventListener('pagehide', () => { flushTyping(); markVisible(false); flushOnHide(); });
  window.addEventListener('online', () => { if (SC.on) syncNow(false); });
  if (SC.on) { setSync('busy'); syncNow(true); }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(e => logDiag('sw: ' + e.message));
}
/* text boxes save as you type (debounced); this writes any pending text right away */

function bindMap() {
  const box = $('#mapbox'); if (!box) return;
  if (PULSE) setTimeout(() => { PULSE = ''; const d = $('.mdot.pulse'); if (d) d.classList.remove('pulse'); }, 2200);
  $$('.mdot').forEach(el => attachDrag(el, box));
}
function attachDrag(el, box) {
  let down = false, drag = false, sx = 0, sy = 0, fromTray = false, pos = null, pid = el.dataset.id;
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    down = true; drag = false; sx = e.clientX; sy = e.clientY;
    fromTray = !!el.closest('#tray');
    pos = null;
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    if (!drag && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) {
      drag = true; el.classList.add('drag');
      if (fromTray) {
        /* lift the dot out of the tray and onto the map at the finger's position */
        try { el.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        box.appendChild(el); el.style.margin = '';
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }
    }
    if (!drag) return;
    const r = box.getBoundingClientRect();
    const x = clamp((e.clientX - r.left) / r.width * 100, -8, 108), y = clamp((e.clientY - r.top) / r.height * 100, -30, 108);
    pos = { x, y };
    el.style.left = x + '%'; el.style.top = y + '%';
    el.style.background = ZONE_COL[zoneOf({ x: clamp(x, 0, 100), y: clamp(y, 0, 100) })];
  });
  const end = e => {
    if (!down) return; down = false;
    try { el.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const p = getP(pid); if (!p) return softRender();
    if (!drag) { openView('person', pid); return; }
    el.classList.remove('drag');
    const tray = $('#tray');
    const tr = tray && tray.getBoundingClientRect();
    if (e.type !== 'pointercancel' && tr && e.clientX >= tr.left - 8 && e.clientX <= tr.right + 8 && e.clientY >= tr.top - 8 && e.clientY <= tr.bottom + 8) p.place = null;
    else if (e.type === 'pointercancel' || !pos) { /* keep where it was */ }
    else if (pos.y < -4 && !p.place) { /* dropped above the map while coming from the tray: leave it there */ }
    else p.place = { x: Math.round(clamp(pos.x, 0, 100) * 10) / 10, y: Math.round(clamp(pos.y, 0, 100) * 10) / 10 };
    commit(); softRender();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openView('person', pid); } });
}

  h += `<div class="card"><div class="lbl">Names</div><p class="sm" style="margin:6px 0 0">Rename the map zones and the action levels. Saved as you type.</p>

    ${ZONES.map(k => `<div class="row0" style="margin-top:8px"><i style="width:12px;height:12px;border-radius:50%;background:${ZONE_COL[k]};flex:none"></i><input class="in" data-in="zname" data-k="${k}" maxlength="60" value="${esc(S.labels.zones[k])}" aria-label="Name for zone ${k}"></div>`).join('')}
    <div class="fl" style="margin-top:14px">Action levels</div>
    ${LEVELS.map(i => `<div class="row0" style="margin-top:8px">${levelDot(i, 12)}<input class="in" data-in="lname" data-i="${i}" maxlength="30" value="${esc(S.labels.levels[i])}" aria-label="Name for level ${i + 1}"></div>`).join('')}
    <button class="link" style="margin-top:12px;font-size:14px" data-act="resetNames">Reset to the default names</button></div>`;
  h += `<div class="card"><div class="lbl">Display</div>
    <label class="toggle"><input type="checkbox" data-in="lite" ${D.lite ? 'checked' : ''}> Lite mode (no animation)</label>
    ${D.autoLite && D.lite ? '<p class="sm" style="margin:0">Turned on by itself after Kokoro closed unexpectedly.</p>' : ''}</div>`;
  h += `<div class="card"><div class="lbl">Diagnostics</div>
    <div class="diag" style="margin-top:8px">${DIAG.length ? esc(DIAG.slice(-12).join('\n')) : 'No problems logged.'}</div>
    <div class="btns"><button class="btn g sm2" data-act="copyDiag">Copy report</button><button class="btn g sm2" data-act="clearDiag">Clear</button></div></div>`;
  h += `<div class="card"><div class="lbl">Erase</div><p class="sm" style="margin:6px 0 0">${SC.on ? 'Erases everything here and on every device that syncs with this one.' : 'Erases everything on this phone. Export a backup first.'}</p>
    <button class="btn d w" style="margin-top:10px" data-act="eraseAll">Erase all data</button></div>`;
  h += `<p class="sm" style="text-align:center;margin:6px 0 14px">Kokoro ${APP_VER} · ${plural(S.people.length, 'person', 'people')} · ${plural(S.actions.length, 'action')} · ${plural(S.thoughts.length, 'thought')} · ${plural(S.sessions.length, 'session')} · ${total ? 'saved on this phone' : 'nothing saved yet'}</p>`;
  return h;
}
function markExported() { S.meta.lastExport = Date.now(); S.meta.changes = 0; persist(); }
function exportNow() {
  if (download(backupName(), backupJSON(S), 'application/json')) { markExported(); toast('Backup saved to your downloads'); softRender(); }
  else backupTextSheet();
}
async function shareBackup() {
  try { const f = new File([backupJSON(S)], backupName(), { type: 'application/json' }); await navigator.share({ files: [f], title: 'Kokoro backup' }); markExported(); softRender(); }
  catch (e) { if (e && e.name !== 'AbortError') { logDiag('share: ' + e.message); backupTextSheet(); } }
}
function backupTextSheet() {
  openSheet(() => `${sheetHead('Backup as text')}<p class="sm" style="margin:0 0 8px">Copy all of this and keep it somewhere safe, like a note. To restore it, save it as a .json file and use Import.</p>
    <textarea class="in report" readonly id="bkText">${esc(backupJSON(S))}</textarea><button class="btn w" style="margin-top:10px" data-act="bkCopy">Copy</button>`);
}
let IMPORT = null;
function onImportText(text) {
  try { IMPORT = parseImport(text); }
  catch (e) { IMPORT = null; openSheet(() => `${sheetHead('Can’t import')}<p>${esc((e && e.msg) || 'That file couldn’t be read.')}</p><button class="btn w" data-act="closeSheet">OK</button>`); return; }
  const m = IMPORT.summary;
  openSheet(() => `${sheetHead(m.kind === 'old' ? 'Import your old data' : 'Import backup')}
    <p>This file has ${plural(m.people, 'person', 'people')}, ${plural(m.actions, 'action')}, ${plural(m.thoughts, 'thought')} and ${plural(m.sessions, 'session')}.</p>
    ${m.notes.length ? `<ul class="sm" style="margin:0 0 8px;padding-left:18px">${m.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    <p class="sm"><b>Merge</b> keeps everything you have, adds what’s new and updates anything changed more recently in the file. <b>Replace</b> swaps all your current data for this file${SC.on ? ', on every synced device' : ''}.</p>
    <div class="btns"><button class="btn d" data-act="impReplace">Replace</button><button class="btn" data-act="impMerge">Merge</button></div>`);
}
function applyImport(mode) {
  if (!IMPORT) return closeSheet();
  const I = IMPORT.st; IMPORT = null;
  if (mode === 'replace') {
    const old = idsOf(S);
    S.people = I.people; S.actions = I.actions; S.thoughts = I.thoughts; S.sessions = I.sessions; S.del = {};
    S.labels = I.labels ? sLabels(I.labels) : sLabels({});
    if (I.zones) Object.assign(S.labels.zones, I.zones);
    fixAfterMerge(); touchAll(old); S.meta.changes += 1;
    markDirty(); persist(); schedSync();
    closeSheet(); goTab(TAB); toast('Data replaced');
    return;
  }
  for (const col of SYNC_COLS) {
    const L = new Map(S[col].map(x => [x.id, x]));
    for (const x of I[col]) {
      const cur = L.get(x.id), delAt = S.del[x.id] || 0;
      if (!cur) { if (!delAt || (x.u || 0) > delAt) { S[col].push(x); L.set(x.id, x); } }
      else if ((x.u || 0) > (cur.u || 0)) Object.assign(cur, x);
    }
  }
  if (I.labels && (I.labels.u || 0) > (S.labels.u || 0)) S.labels = sLabels(I.labels);
  if (I.zones) Object.assign(S.labels.zones, I.zones);
  fixAfterMerge(); commit();
  closeSheet(); softRender(); toast('Merged');
}
function eraseAll() {
  S.people = []; S.actions = []; S.thoughts = []; S.sessions = []; S.labels = sLabels({}); S.meta.changes = 0;
  DRAFT = { text: '', type: '', pid: '' }; saveDraft(); JUST_SAVED = '';
  commit(); goTab('becoming'); toast('Everything was erased');
}

/* =====================================================================
   FAB: quick add
   ===================================================================== */
function fabSheet() {
  openSheet(() => `${sheetHead('Add')}
    <div class="big3">
      <button data-act="fabThought"><span class="ic" style="background:${TYPE_COL.spiral}">✎</span><span><b>Write a thought</b><span class="sm" style="display:block">Spiral, hope or fact</span></span></button>
      <button data-act="fabAction"><span class="ic" style="background:${LEVEL_COL[3]}">●</span><span><b>Log an action</b><span class="sm" style="display:block">What someone did, and how it landed</span></span></button>
      <button data-act="addPerson"><span class="ic" style="background:${ZONE_COL.ring2}">+</span><span><b>Add a person</b><span class="sm" style="display:block">Then place them on your map</span></span></button>
    </div>`);
}

/* =====================================================================
   EVENTS (one delegated handler for taps, one for typing)
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  try { ACTIONS[act] && ACTIONS[act](el, id, e); }
  catch (err) { logDiag('act ' + act + ': ' + (err && err.message)); toast('Something went wrong. Your data is safe.'); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.act === 'word') { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'tIn') { e.preventDefault(); ACTIONS.tAdd(); }
});
const ACTIONS = {
  closeSheet: () => closeSheet(),
  back: () => { if (LAY.length) popLayerUI(); else goTab(TAB); },
  tab: el => goTab(el.dataset.v),
  fab: () => fabSheet(),
  fabThought: () => { goTab('becoming'); setTimeout(() => { const t = $('#newT'); if (t) t.focus(); }, 80); },
  fabAction: () => choosePersonSheet(),
  syncDot: () => goTab('settings'),
  /* becoming */
  draftType: el => { DRAFT.type = el.dataset.v; saveDraft(); setTypeButtons($('#draftTypes'), DRAFT.type); const e = $('#newErr'); if (e) e.textContent = ''; },
  saveThought: () => saveThought(),
  stressIt: (el, id) => stressIt(id),
  stressItS: (el, id) => { saveThoughtEdits(true); stressIt(id); },
  libF: el => { LIBF = el.dataset.v; LIBN = 40; softRender(); },
  libMore: () => { LIBN += 60; softRender(); },
  sesMore: () => { SESN += 20; softRender(); },
  thought: (el, id) => thoughtSheet(id),
  teType: el => { TEDIT.type = el.dataset.v; setTypeButtons($('#teTypes'), TEDIT.type); },
  teSave: () => { if (saveThoughtEdits()) { closeSheet(); softRender(); toast('Saved'); } },
  teDel: el => { if (!armed(el, 'Tap again to delete')) return; deleteThought(TEDIT.id); closeSheet(); softRender(); toast('Thought deleted'); },
  newSession: () => pickSheet('new'),
  addToSession: () => { const s = curSession(); if (s) pickSheet('add', s.id); },
  pickF: el => { $$('.seg button', el.parentNode.parentNode).forEach(b => b.classList.toggle('on', b === el)); $$('#pickList .pick').forEach(r => r.classList.toggle('hidden', el.dataset.v !== 'all' && r.dataset.type !== el.dataset.v)); },
  pickGo: () => pickGo(),
  openSession: (el, id) => { if (getS(id)) openView('session', id); },
  word: el => { const t = el.dataset.t, i = +el.dataset.i; const set = PICKS[t] || (PICKS[t] = new Set()); if (set.has(i)) set.delete(i); else set.add(i); el.classList.toggle('pk', set.has(i)); const x = $('#xerr-' + CSS.escape(t)); if (x) x.textContent = ''; },
  extract: el => extract(el.dataset.t),
  delNote: el => { if (!armed(el, 'Tap again')) return; const s = curSession(); if (!s) return; s.notes = s.notes.filter(n => n.id !== el.dataset.n); commit(); softRender(); },
  unlinkT: el => { if (!armed(el, 'Tap again to remove')) return; const s = curSession(); if (!s) return; const t = el.dataset.t; s.thoughtIds = s.thoughtIds.filter(x => x !== t); s.notes = s.notes.filter(n => n.tid !== t); delete PICKS[t]; commit(); softRender(); toast('Removed from this session. The thought stays in your library.'); },
  linkType: el => { LINKTYPE = el.dataset.v; setTypeButtons($('#linkTypes'), LINKTYPE); },
  linkNew: () => {
    const s = curSession(); if (!s) return;
    const text = sStr($('#linkT').value, 2000).trim(), err = $('#linkErr');
    if (!text) { err.textContent = 'Write the new thought first.'; return; }
    if (!LINKTYPE) { err.textContent = 'Pick what kind of thought this is.'; return; }
    const t = { id: uid(), text, type: LINKTYPE, pid: '', date: Date.now(), u: 0 };
    S.thoughts.push(t); s.linked.push(t.id); LINKTYPE = ''; commit(); softRender(); toast('Saved and linked');
  },
  toggleOpen: () => { const s = curSession(); if (!s) return; flushTyping(); const was = s.open; S.sessions.forEach(x => { x.open = false; }); s.open = !was; commit(); softRender(); toast(s.open ? 'Session reopened' : 'Session closed'); },
  delSession: el => { if (!armed(el, 'Tap again to delete the session')) return; const s = curSession(); if (!s) return; S.sessions = S.sessions.filter(x => x.id !== s.id); commit(); popLayerUI(); toast('Session deleted. Its thoughts stay in your library.'); },
  report: () => { flushTyping(); const s = curSession(); if (s) reportSheet(s); },
  repCopy: () => copyText($('#repBox').value).then(ok => toast(ok ? 'Copied. Paste it to Claude.' : 'Couldn’t copy. Select the text and copy it.')),
  repDl: () => { download('stress-test-' + stamp(Date.now()) + '.md', $('#repBox').value, 'text/markdown') ? toast('Saved to your downloads') : toast('Couldn’t save. Use Copy instead.'); },
  repShare: () => { navigator.share({ title: 'Stress test session', text: $('#repBox').value }).catch(() => {}); },
  /* map and people */
  addPerson: () => personSheet(null),
  person: (el, id) => openView('person', id),
  pf: el => { PF = +el.dataset.v; $$('#pfChips .chip').forEach(c => c.classList.toggle('on', +c.dataset.v === PF)); $('#plist').innerHTML = peopleList(); },
  editPerson: (el, id) => { const p = getP(id); if (p) personSheet(p); },
  pSave: (el, id) => savePerson(id),
  pDel: (el, id) => { if (!armed(el, 'Tap again to delete')) return; deletePerson(id); },
  showOnMap: (el, id) => { PULSE = id; goTab('map'); const d = $(`.mdot[data-id="${CSS.escape(id)}"]`); if (d) d.scrollIntoView({ block: 'center' }); if (!getP(id).place) toast('Drag them from “Not on the map yet” onto the circle.'); },
  traits: () => { const p = curPerson(); if (p) traitsSheet(p); },
  trait: (el, id) => { const p = curPerson(); const t = p && p.traits.find(x => x.id === id); if (t) traitSheet(p, t); },
  preset: el => {
    const p = curPerson(); if (!p) return; const v = el.dataset.v, low = v.toLowerCase();
    if (p.traits.some(x => x.text.toLowerCase() === low)) p.traits = p.traits.filter(x => x.text.toLowerCase() !== low);
    else if (p.traits.length < LIM.traits) p.traits.push({ id: uid(), text: v });
    const on = p.traits.some(x => x.text.toLowerCase() === low); el.classList.toggle('on', on); el.setAttribute('aria-pressed', on);
    commit(); render();
  },
  tAdd: () => {
    const p = curPerson(), inp = $('#tIn'); if (!p || !inp) return; const v = sLine(inp.value, 48); if (!v) return;
    if (!p.traits.some(x => x.text.toLowerCase() === v.toLowerCase()) && p.traits.length < LIM.traits) { p.traits.push({ id: uid(), text: v }); commit(); render(); toast('Added “' + v + '”'); }
    inp.value = ''; inp.focus();
  },
  etSave: (el, id) => { const p = curPerson(), t = p && p.traits.find(x => x.id === id); const v = sLine($('#etIn').value, 48); if (t && v) { t.text = v; commit(); } closeSheet(); softRender(); },
  etDel: (el, id) => { const p = curPerson(); if (p) { p.traits = p.traits.filter(x => x.id !== id); commit(); } closeSheet(); softRender(); },
  logAction: (el, id) => { const p = getP(id); if (p) actionSheet(p, null); },
  logFor: (el, id) => { const p = getP(id); if (p) actionSheet(p, null); },
  action: (el, id) => { const a = S.actions.find(x => x.id === id), p = a && getP(a.pid); if (p) actionSheet(p, a); },
  alv: el => { ALV = +el.dataset.v; paintLevels(); const e = $('#aErr'); if (e) e.textContent = ''; },
  aSave: el => saveAction(el.dataset.p, el.dataset.id),
  aDel: (el, id) => { if (!armed(el, 'Tap again to delete')) return; S.actions = S.actions.filter(x => x.id !== id); commit(); closeSheet(); softRender(); toast('Action deleted'); },
  thoughtAbout: (el, id) => { DRAFT.pid = id; saveDraft(); goTab('becoming'); setTimeout(() => { const t = $('#newT'); if (t) t.focus(); }, 80); },
  /* settings */
  exportNow: () => exportNow(),
  shareBackup: () => shareBackup(),
  backupText: () => backupTextSheet(),
  bkCopy: () => copyText($('#bkText').value).then(ok => { if (ok) { markExported(); toast('Copied'); } else toast('Couldn’t copy. Select the text and copy it.'); }),
  importFile: () => { const f = $('#file'); f.value = ''; f.click(); },
  impMerge: () => applyImport('merge'),
  impReplace: el => { if (!armed(el, 'Tap again to replace')) return; applyImport('replace'); },
  setTheme: el => { D.theme = el.dataset.v; D.random = false; saveDev(); applyTheme(D.theme); SCENE_KEY = ''; softRender(); },
  resetNames: () => { S.labels = { ...sLabels({}), u: S.labels.u }; commit(); softRender(); toast('Names reset'); },
  copyDiag: () => copyText(`Kokoro ${APP_VER}\n${navigator.userAgent}\nstorage ${STORAGE_OK ? 'ok' : 'blocked'} · lite ${D.lite} · sync ${SC.on ? SY.st : 'off'}\n` + DIAG.join('\n')).then(ok => toast(ok ? 'Report copied' : 'Couldn’t copy')),
  clearDiag: () => { DIAG = []; lsSet(LS_DIAG, '[]'); softRender(); },
  eraseAll: el => { if (!armed(el, SC.on ? 'Tap again: erase on every device' : 'Tap again to erase everything')) return; eraseAll(); },
  syncSrvShow: () => { const f = $('#srvFld'); if (f) f.classList.remove('hidden'); },
  syncConnect: async el => {
    const pin = ($('#spin').value || '').trim(), srvIn = $('#ssrv'), server = srvIn && !$('#srvFld').classList.contains('hidden') ? srvIn.value.trim().replace(/\/+$/, '') : '';
    const err = $('#syncErr');
    if (!/^\d{4,8}$/.test(pin)) { err.textContent = 'Enter your PIN: 4 to 8 digits.'; return; }
    if (server && !/^https?:\/\/[^\s"'<>]+$/.test(server)) { err.textContent = 'The address should start with https://'; return; }
    if (!server && !pageServer()) { err.textContent = 'Add the address of your sync site.'; $('#srvFld').classList.remove('hidden'); return; }
    el.disabled = true; el.textContent = 'Connecting…';
    try {
      const r = await connectSync(pin, server);
      if (r === 'ask') {
        openSheet(() => `${sheetHead('Your cloud already has data')}<p>This phone has data too. <b>Merge both</b> keeps everything from both places. <b>Use cloud copy</b> replaces this phone’s data with the cloud’s.</p>
          <div class="btns"><button class="btn g" data-act="connCloud">Use cloud copy</button><button class="btn" data-act="connMerge">Merge both</button></div>`);
        return;
      }
      setSync('ok'); toast(r === 'took' ? 'Connected. Your data came from the cloud.' : 'Connected'); syncNow(true); softRender();
    } catch (e2) { if (err.isConnected) err.textContent = syncErrText(e2); el.disabled = false; el.textContent = 'Connect'; }
  },
  connMerge: () => { finishConnect('merge'); closeSheet(); syncNow(true); softRender(); toast('Connected and merged'); },
  connCloud: el => { if (!armed(el, 'Tap again: use the cloud copy')) return; finishConnect('cloud'); closeSheet(); syncNow(true); softRender(); toast('Connected'); },
  syncNowBtn: () => syncNow(true),
  signIn: () => { flushTyping(); persist(); location.reload(); },
  syncPin: () => { const v = ($('#spin2').value || '').trim(); if (!/^\d{4,8}$/.test(v)) return toast('Enter 4 to 8 digits'); SC.pin = v; saveSC(); SY.st = 'busy'; syncNow(true); },
  syncOff: el => { if (!armed(el, 'Tap again to disconnect')) return; disconnectSync(); softRender(); toast('Sync is off. Your data stays on this phone.'); }
};
function saveThoughtEdits(quiet) {
  const t = TEDIT && getT(TEDIT.id); if (!t) return false;
  const text = sStr($('#teText').value, 2000).trim();
  if (!text) { if (!quiet) $('#teErr').textContent = 'A thought can’t be empty.'; return false; }
  const pid = $('#teP').value;
  t.text = text; t.type = TEDIT.type; t.pid = getP(pid) ? pid : '';
  /* a note's phrase came from the old wording; it stays as written */
  commit(); return true;
}

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'draftText') { DRAFT.text = el.value; typeSave('draft', saveDraft, 400); const er = $('#newErr'); if (er) er.textContent = ''; }
  else if (k === 'pq') { PQ = el.value; $('#plist').innerHTML = peopleList(); }
  else if (k === 'note') { const s = curSession(), n = s && s.notes.find(x => x.id === el.dataset.n); if (n) { n.comment = sStr(el.value, 4000); typeSave('note' + n.id, commit); } }
  else if (k === 'concl') { const s = curSession(); if (s) { s.conclusion = sStr(el.value, 4000); typeSave('concl' + s.id, commit); } }
  else if (k === 'refl') {
    const p = curPerson(); if (!p) return; const key = el.dataset.k;
    p.refl[key] = sStr(el.value, 4000);
    typeSave('refl' + p.id + key, () => { commit(); const s = $('#sv-' + key); if (s) { s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 1200); } }, 600);
  }
  else if (k === 'zname') { S.labels.zones[el.dataset.k] = sLine(el.value, 60) || ZONE_DEF[el.dataset.k]; typeSave('labels', commit); }
  else if (k === 'lname') { S.labels.levels[+el.dataset.i] = sLine(el.value, 30) || LEVEL_DEF[+el.dataset.i]; typeSave('labels', commit); }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (k === 'draftP') { DRAFT.pid = el.value; saveDraft(); }
  else if (k === 'random') { D.random = el.checked; if (!D.random) D.theme = THEME; saveDev(); softRender(); }
  else if (k === 'lite') { D.lite = el.checked; if (!D.lite) D.autoLite = false; saveDev(); applyLite(); softRender(); }
  else if (el.id === 'file') {
    const f = el.files && el.files[0]; if (!f) return;
    if (f.size > 20e6) { toast('That file is too large to be a Kokoro backup.'); return; }
    const r = new FileReader();
    r.onload = () => onImportText(String(r.result || ''));
    r.onerror = () => toast('Couldn’t read that file.');
    r.readAsText(f);
  }
});

start();
})();
</script>
